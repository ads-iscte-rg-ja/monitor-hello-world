# Gerado a partir de monitor-platform/templates/ci.yml.
# Toda a lógica vive em monitor-platform; aqui só se escolhem as opções do repo.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  go:
    uses: ads-iscte-rg-ja/monitor-platform/.github/workflows/go-ci.yml@v1
    with:
      # replace => ../monitor-go-sdk no go.mod; sai quando o SDK tiver versões publicadas.
      sibling-repos: ads-iscte-rg-ja/monitor-go-sdk
      # false durante a medição de baseline (iteração 0); true depois.
      lint-blocking: false
    secrets: inherit
